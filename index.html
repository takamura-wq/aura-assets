<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            400: '#facc15', // Yellow 400
                            500: '#f59e0b', // Amber 500
                            600: '#d97706', // Amber 600
                            900: '#78350f', // Amber 900
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 4s linear infinite',
                    }

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020203;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.1) 0%, transparent 50%);
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Background Canvas */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none; 
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(145deg, rgba(15, 15, 18, 0.8), rgba(5, 5, 8, 0.95));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Dark Input */
        .input-dark {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f8fafc;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .input-dark:focus {
            border-color: #facc15;
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2), inset 0 2px 4px rgba(0,0,0,0.8);
            outline: none;
        }

        /* Cyber Button */
        .btn-cyber {
            background: linear-gradient(135deg, #d97706 0%, #facc15 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            color: #000;
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-cyber:hover {
            box-shadow: 0 6px 25px rgba(250, 204, 21, 0.6), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateY(-2px);
        }
        .btn-cyber:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Glitch Effect */
        .glitch { position: relative; display: inline-block; }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; pointer-events: none;
        }
        .glitch::before {
            left: 2px; text-shadow: -2px 0 #facc15; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 4s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -2px 0 #ef4444, 2px 2px #f97316; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 4s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim { 0%, 95% { clip: rect(0,0,0,0); } 96% { clip: rect(10px, 9999px, 31px, 0); transform: skew(0.5deg); } 98% { clip: rect(24px, 9999px, 12px, 0); transform: skew(-0.5deg); } 100% { clip: rect(0, 0, 0, 0); } }
        @keyframes glitch-anim2 { 0%, 95% { clip: rect(0,0,0,0); } 96% { clip: rect(65px, 9999px, 100px, 0); transform: translate(-2px, 2px); } 98% { clip: rect(5px, 9999px, 40px, 0); transform: translate(2px, -2px); } 100% { clip: rect(0, 0, 0, 0); } }

        /* Modals & Overlays */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        /* Brankas Rahasia */
        #secret-vault {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 999; overflow-y: auto; padding: 40px 20px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    </style>
</head>

                <div class="relative w-24 h-24 md:w-28 md:h-28 rounded-full bg-black border-2 border-cyber-500 shadow-[0_0_30px_rgba(245,158,11,0.4)] z-10 flex items-center justify-center text-4xl text-cyber-400 select-none">

             <p class="text-[10px] text-cyber-500/50 font-mono tracking-widest uppercase">System Online // v3.0</p>
        </footer>
    </div>

    <!-- MODAL POP-UP CUSTOM (UNTUK FAKE DOWNLOAD & AUTH BRANKAS) -->
    <div id="auth-modal" class="modal-overlay">
        <div class="transform scale-95 transition-all duration-300 relative w-[90%] max-w-sm glass-panel rounded-xl p-6" id="auth-content">
            <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-yellow-300 via-cyber-500 to-orange-600"></div>
            
            <h3 id="modal-title" class="text-sm font-bold text-white mb-4 tracking-widest uppercase mono">Enter License Key:</h3>
            
            <input type="text" id="modal-input" class="w-full input-dark rounded px-3 py-3 text-sm mono mb-4" placeholder="Paste token here..." autocomplete="off">
            
            <!-- Pesan Error / Alert -->

            <div id="modal-actions" class="flex justify-end gap-3 mt-2">
                <button onclick="closeAuthModal()" class="px-4 py-2 rounded text-xs font-bold text-slate-400 hover:text-white transition mono border border-slate-700">CANCEL</button>
                <button id="modal-btn-submit" onclick="submitAuthModal()" class="px-6 py-2 btn-cyber text-xs font-bold rounded mono">VERIFY</button>
            </div>

    </div>

    <!-- RUANG RAHASIA (PENAMPIL MEDIA) -->
    <div id="secret-vault">
        <button onclick="closeVault()" class="fixed top-4 right-4 md:top-6 md:right-8 w-10 h-10 rounded bg-black/50 border border-cyber-500/30 hover:border-cyber-400 text-cyber-400 flex items-center justify-center z-[1000]"><i class="fas fa-times"></i></button>
        <div class="max-w-4xl mx-auto text-center mt-10">
            <h2 class="text-cyber-400 font-bold tracking-widest mb-6 mono glitch" data-text="SYSTEM DECRYPTED">SYSTEM DECRYPTED</h2>
            <div id="media-container" class="rounded-xl overflow-hidden border border-cyber-500/30 shadow-[0_0_40px_rgba(245,158,11,0.2)]"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // DATA ASET KAMUFLASE
        // ==========================================
        const ASSETS = [
            { nama: "Cinematic LUT Pack v2", icon: "fas fa-film", deskripsi: "15 color grading presets for Premiere Pro & DaVinci Resolve.", tag: "LUTs", size: "24 MB" },
            { nama: "Glitch Transitions", icon: "fas fa-bolt", deskripsi: "Drag-and-drop seamless glitch transitions for your next vlog.", tag: "SFX", size: "112 MB" },
            { nama: "Lo-Fi Backgrounds", icon: "fas fa-music", deskripsi: "No-copyright background music tracks for safe monetization.", tag: "Audio", size: "58 MB" },
            { nama: "Title Animations", icon: "fas fa-font", deskripsi: "Modern kinetic typography templates for After Effects.", tag: "Template", size: "15 MB" }
        ];

        const BIO_TEXT = "Download free LUTs, transitions, and overlays. As a thank you to my subscribers, all assets here are 100% free to use in your projects.";

        function initApp() {
            // Efek ngetik di deskripsi
            const bioEl = document.getElementById('profile-bio');
            let i = 0;
            function typeWriter() {
                if (i < BIO_TEXT.length) {
                    bioEl.innerHTML = BIO_TEXT.substring(0, i + 1) + '<span class="cursor-blink bg-cyber-400 text-black ml-1 px-[3px]">_</span>';
                    i++;
                    setTimeout(typeWriter, 35);
                } else {
                    bioEl.innerHTML = BIO_TEXT + '<span class="cursor-blink text-cyber-400 ml-1">_</span>';
                }
            }
            setTimeout(typeWriter, 800);

            renderAssets();
            initParticles();
        }

        // ==========================================
        // RENDER KARTU ASET (STYLE ASLI MILIKMU)
        // ==========================================
        function renderAssets() {
            const container = document.getElementById('assets-container');
            let html = '';
            
            ASSETS.forEach((item, index) => {
                const delay = 300 + (index * 100); 
                html += `
                    <div class="opacity-0 translate-y-10" style="animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${delay}ms forwards;">
                        <div class="cyber-card relative group rounded-xl p-[1px] h-full flex flex-col transform-gpu transition-transform duration-200" onpointerdown="this.style.transform='scale(0.98)'" onpointerup="this.style.transform='scale(1)'">
                            
                            <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none opacity-40 group-hover:opacity-100 transition-opacity duration-300">
                                <div class="absolute w-[200%] h-[200%] top-[-50%] left-[-50%] bg-[conic-gradient(from_0deg,transparent_0%,transparent_70%,#facc15_100%)] animate-spin-slow"></div>
                            </div>
                            
                            <div class="card-inner relative z-10 bg-[#07070a] rounded-[11px] p-4 md:p-5 flex flex-col h-full group-hover:bg-[#0a0a0f] transition-colors border border-white/5">
                                <div class="flex items-start gap-4 mb-3 md:mb-4">
                                    <div class="w-12 h-12 shrink-0 rounded bg-black border border-cyber-500/20 text-cyber-500/70 flex justify-center items-center text-xl transition-all duration-300 group-hover:bg-cyber-400 group-hover:text-black group-hover:border-cyber-400 group-hover:shadow-[0_0_15px_#facc15]">
                                        <i class="${item.icon}"></i>
                                    </div>
                                    <div class="flex-1 min-w-0 pt-1">
                                        <h3 class="text-white font-extrabold text-sm md:text-base tracking-wide truncate group-hover:text-cyber-400 transition-colors">${item.nama}</h3>
                                        <span class="inline-block mt-0.5 text-[9px] uppercase font-bold tracking-widest bg-black border border-cyber-500/30 text-cyber-400 px-1.5 py-[2px] rounded shadow-sm">${item.tag} • ${item.size}</span>
                                    </div>
                                </div>
                                <p class="text-slate-400 text-[10px] md:text-xs leading-relaxed font-mono flex-1 mb-4 group-hover:text-slate-300 line-clamp-3">${item.deskripsi}</p>
                                
                                <!-- TOMBOL DOWNLOAD FAKE -->
                                <div class="mt-auto">
                                    <button onclick="openAuthModal('fake', 'Enter License for ${item.nama}')" class="w-full py-2.5 md:py-3 bg-black border border-cyber-500/30 hover:border-cyber-400 text-cyber-400 font-extrabold rounded text-[10px] md:text-xs transition-all flex items-center justify-center gap-2 group/btn">
                                        DOWNLOAD (.zip) <i class="fas fa-download opacity-80 group-hover/btn:translate-y-1 transition-transform"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            setTimeout(initTiltEffect, 500); 
        }

        // Efek 3D Card
        function initTiltEffect() {
            const cards = document.querySelectorAll('.cyber-card');
            cards.forEach(card => {
                const inner = card.querySelector('.card-inner');
                card.addEventListener('pointermove', e => {
                    if(window.innerWidth < 768) return; 
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -8; 
                    const rotateY = ((x - centerX) / centerX) * 8;
                    inner.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });
                card.addEventListener('pointerleave', () => {
                    inner.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                });
            });
        }

        // ==========================================
        // SISTEM MODAL & TRIGGER RAHASIA
        // ==========================================
        let modalMode = 'fake'; 
        let avatarClicks = 0;
        let clickTimer;
        
        const modalEl = document.getElementById('auth-modal');
        const modalContent = document.getElementById('auth-content');
        const modalInput = document.getElementById('modal-input');
        const modalError = document.getElementById('modal-error');
        const modalActions = document.getElementById('modal-actions');
        const modalTitle = document.getElementById('modal-title');
        const btnSubmit = document.getElementById('modal-btn-submit');

        // TRIGGER RAHASIA: KLIK AVATAR 5X
        document.getElementById('avatar-trigger').addEventListener('click', () => {
            avatarClicks++;
            clearTimeout(clickTimer);
            if (avatarClicks >= 5) {
                avatarClicks = 0;
                openAuthModal('real', 'System Override - Enter Access Key:');
            } else {
                clickTimer = setTimeout(() => { avatarClicks = 0; }, 600);
            }
        });

        function openAuthModal(mode, title) {
            modalMode = mode;
            modalTitle.innerText = title;
            modalTitle.className = "text-sm font-bold text-white mb-4 tracking-widest uppercase mono";
            
            modalInput.style.display = 'block';
            modalInput.value = '';
            modalError.classList.add('hidden');
            modalActions.style.display = 'flex';
            btnSubmit.style.display = 'block';

            modalEl.classList.add('active');
            setTimeout(() => {
                modalContent.classList.replace('scale-95', 'scale-100');
                modalInput.focus();
            }, 10);
        }

        function closeAuthModal() {
            modalContent.classList.replace('scale-100', 'scale-95');
            setTimeout(() => modalEl.classList.remove('active'), 300);
        }

        // Enter key support
        modalInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitAuthModal();
        });

        function submitAuthModal() {
            const pwd = modalInput.value.trim();
            if(!pwd) return;

            if (modalMode === 'fake') {
                modalInput.style.display = 'none';
                modalTitle.innerText = "Verifying License...";
                modalTitle.className = "text-sm font-bold text-cyber-400 mb-4 tracking-widest uppercase mono animate-pulse";
                btnSubmit.style.display = 'none';

                setTimeout(() => {
                    modalTitle.innerText = "SYSTEM ALERT";
                    modalTitle.className = "text-sm font-bold text-red-500 mb-2 tracking-widest uppercase mono";
                    modalError.innerHTML = "Bandwidth limit exceeded for today due to high YouTube traffic.<br><br>Please try downloading again in 24 hours.";
                    modalError.classList.remove('hidden');
                }, 1200);
            } else {
                closeAuthModal();
                processVaultAccess(pwd);
            }
        }

        // ==========================================
        // DEKRIPSI WEB CRYPTO API
        // ==========================================
        async function processVaultAccess(password) {
            try {
                const encoder = new TextEncoder();
                const pwdBytes = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', pwdBytes);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const fileNameHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                const response = await fetch(`${fileNameHash}.enc`);
                if (!response.ok) throw new Error("File not found");
                
                const encryptedData = await response.arrayBuffer();
                const key = await crypto.subtle.importKey('raw', hashBuffer, { name: 'AES-GCM' }, false, ['decrypt']);

                const iv = encryptedData.slice(0, 12);
                const data = encryptedData.slice(12);
                const decryptedBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(iv) }, key, data);
                
                const decArray = new Uint8Array(decryptedBuffer);
                const extLen = decArray[0];
                const extStr = new TextDecoder().decode(decArray.slice(1, 1 + extLen));
                const fileBytes = decArray.slice(1 + extLen);

                let mimeType = 'application/octet-stream';
                if (['.jpg', '.jpeg'].includes(extStr)) mimeType = 'image/jpeg';
                else if (extStr === '.png') mimeType = 'image/png';
                else if (extStr === '.mp4') mimeType = 'video/mp4';

                const blob = new Blob([fileBytes], { type: mimeType });
                const mediaUrl = URL.createObjectURL(blob);

                const container = document.getElementById('media-container');
                if (mimeType.startsWith('video/')) {
                    container.innerHTML = `<video src="${mediaUrl}" controls autoplay controlsList="nodownload" class="w-full"></video>`;
                } else {
                    container.innerHTML = `<img src="${mediaUrl}" alt="Decrypted Data" class="w-full">`;
                }

                document.body.style.overflow = 'hidden';
                document.getElementById('secret-vault').style.display = 'block';

            } catch (error) {
                openAuthModal('fake', 'Error 404:');
                modalInput.style.display = 'none';
                btnSubmit.style.display = 'none';
                modalError.innerHTML = "Access Denied. Invalid token or corrupted data.";
                modalError.classList.remove('hidden');
            }
        }

        function closeVault() {
            document.getElementById('secret-vault').style.display = 'none';
            document.getElementById('media-container').innerHTML = ''; 
            document.body.style.overflow = 'auto';
        }

        // ==========================================
        // BACKGROUND PARTICLES (ASLI)
        // ==========================================
        function initParticles() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];

            function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            let mouse = { x: -1000, y: -1000 };
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive: true});

            class Particle {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
                    this.size = Math.random() * 1.5 + 0.5;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx*dx + dy*dy);
                    if (distance < 120) { this.x -= dx * 0.01; this.y -= dy * 0.01; }
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(245, 158, 11, 0.4)'; ctx.fill();
                }
            }

            const count = width > 768 ? 50 : 25;
            for (let i = 0; i < count; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for (let j = i + 1; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x; let dy = particles[i].y - particles[j].y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 100) {
                            ctx.beginPath(); ctx.strokeStyle = `rgba(245, 158, 11, ${0.15 - dist/666})`;
                            ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
