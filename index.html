<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Assets | Creator Tools</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 
      OFFLINE MODE TIP: 
      Jika Anda ingin web ini bisa dibuka tanpa internet sama sekali, 
      download file JS dari cdn.tailwindcss.com dan file CSS font-awesome, 
      lalu simpan di folder yang sama dengan index.html ini.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { cyber: { 400: '#facc15', 500: '#f59e0b', 600: '#d97706' } },
                    animation: { 'spin-slow': 'spin 4s linear infinite' }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020203; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        .glass-panel { background: linear-gradient(145deg, rgba(15,15,18,0.8), rgba(5,5,8,0.95)); backdrop-filter: blur(20px); border: 1px solid rgba(245,158,11,0.15); }
        .btn-cyber { background: linear-gradient(135deg, #d97706 0%, #facc15 100%); color: #000; transition: all 0.2s; }
        .btn-cyber:active { transform: translateY(2px) scale(0.97); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s forwards; }
        
        /* System Diagnostics Overlay (Obfuscated Secret Room) */
        #sys-diag { position: fixed; inset: 0; background: rgba(2,2,3,0.98); backdrop-filter: blur(15px); z-index: 9999; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; overflow-y: auto; padding: 20px; }
        #sys-diag.active { opacity: 1; pointer-events: auto; }
        #media-container { max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        #media-container video, #media-container img { width: 100%; border-radius: 12px; border: 1px solid rgba(245,158,11,0.3); }

        .cyber-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; padding: 20px; transition: opacity 0.3s; }
        .cyber-modal-overlay.active { opacity: 1; pointer-events: auto; }
        .cyber-input { background: rgba(0,0,0,0.6); border: 1px solid rgba(245,158,11,0.3); color: #facc15; padding: 12px; width: 100%; border-radius: 6px; font-family: monospace; outline: none; }
        .cyber-input:focus { border-color: #facc15; }
    </style>
</head>

<body class="p-3 md:p-8 flex justify-center items-start">
    <canvas id="bg-canvas"></canvas>

    <div class="w-full max-w-4xl flex flex-col gap-6 relative z-10 mx-auto pb-12">
        <nav class="glass-panel rounded-xl p-3 flex justify-between items-center sticky top-2 opacity-0 animate-fade-up">
            <div id="sys-trigger" class="flex items-center gap-2 font-mono text-sm text-slate-500 cursor-default select-none py-2 px-2">
                <i class="fas fa-terminal"></i><span>sys.aura_assets<span class="animate-pulse text-cyber-400">_</span></span>
            </div>
            <div class="flex items-center gap-2 bg-black/50 border border-cyber-500/20 px-3 py-1.5 rounded-full">
                <i class="fas fa-fire text-orange-500 text-[10px] animate-pulse"></i>
                <span class="font-mono text-[10px] text-slate-300">10K+ DL/Today</span>
            </div>
        </nav>

        <div class="text-center mt-4 opacity-0 animate-fade-up" style="animation-delay: 150ms;">
            <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3">Free Assets for <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyber-400 to-cyber-600">Creators</span></h1>
            <p class="text-sm text-slate-400 max-w-lg mx-auto">Download free LUTs, transitions, and overlays 100% free.</p>
        </div>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full" id="assets-container"></main>
    </div>

    <!-- Hidden System -->
    <div id="sys-diag">
        <div class="flex justify-between items-center mb-6 max-w-4xl mx-auto w-full">
            <div class="font-mono text-cyber-400 text-sm"><i class="fas fa-lock-open"></i> MODULE DECRYPTED</div>
            <button onclick="closeSys()" class="w-10 h-10 bg-black/50 border border-cyber-500/30 text-slate-400 rounded"><i class="fas fa-times"></i></button>
        </div>
        <div id="media-container"></div>
    </div>

    <!-- Alert Modal -->
    <div id="custom-alert" class="cyber-modal-overlay">
        <div class="glass-panel p-6 rounded-xl border border-red-500/30 w-full max-w-md">
            <h3 class="font-mono font-bold text-red-500 mb-4"><i class="fas fa-exclamation-triangle"></i> SYSTEM ALERT</h3>
            <p id="alert-msg" class="text-sm text-slate-300 font-mono mb-6 whitespace-pre-line"></p>
            <button onclick="closeAlert()" class="w-full py-3 bg-red-500/10 text-red-400 border border-red-500/50 rounded">ACKNOWLEDGE</button>
        </div>
    </div>

    <!-- Prompt Modal -->
    <div id="custom-prompt" class="cyber-modal-overlay">
        <div class="glass-panel p-6 rounded-xl border border-cyber-500/30 w-full max-w-md">
            <h3 id="prompt-title" class="font-mono font-bold text-cyber-400 mb-4">TERMINAL ACCESS</h3>
            <p id="prompt-desc" class="text-xs text-slate-400 mb-3 font-mono">Enter key:</p>
            <input type="password" id="prompt-input" class="cyber-input mb-6" autocomplete="off">
            <div class="flex gap-3">
                <button onclick="closePrompt(false)" class="flex-1 py-3 bg-black/50 text-slate-400 border border-slate-700 rounded font-mono">CANCEL</button>
                <button onclick="closePrompt(true)" class="flex-1 py-3 btn-cyber rounded font-mono">AUTHORIZE</button>
            </div>
        </div>
    </div>

    <script>
        const ASSETS = [
            { nama: "Cinematic LUT Pack", format: ".cube", icon: "fas fa-film", deskripsi: "15 color grading presets for Premiere Pro & DaVinci Resolve." },
            { nama: "Glitch Transitions", format: ".prproj", icon: "fas fa-bolt", deskripsi: "Drag-and-drop seamless glitch transitions for your next vlog." },
            { nama: "Film Grain Overlay", format: ".mp4", icon: "fas fa-video", deskripsi: "Real 35mm film grain scans with dirt and scratches." }
        ];

        document.getElementById('assets-container').innerHTML = ASSETS.map((item, i) => `
            <div class="bg-[#07070a] rounded-xl p-5 border border-white/5 opacity-0 animate-fade-up" style="animation-delay: ${300 + (i*50)}ms">
                <div class="flex gap-4 mb-3 text-cyber-500 text-xl"><i class="${item.icon}"></i><h3 class="text-white text-sm font-bold truncate">${item.nama}</h3></div>
                <p class="text-slate-400 text-xs font-mono mb-5">${item.deskripsi}</p>
                <button onclick="fakeDownload()" class="w-full py-2 btn-cyber rounded text-xs font-bold">DOWNLOAD</button>
            </div>
        `).join('');

        function fakeDownload() {
            showPrompt("LICENSE VERIFICATION", "Enter License Key:", () => {
                setTimeout(() => showAlert("Bandwidth limit exceeded.\nPlease try downloading again in 24 hours."), 400);
            });
        }

        function showAlert(msg) { document.getElementById('alert-msg').innerText = msg; document.getElementById('custom-alert').classList.add('active'); }
        function closeAlert() { document.getElementById('custom-alert').classList.remove('active'); }
        
        let promptCb = null;
        function showPrompt(title, desc, cb) {
            promptCb = cb;
            document.getElementById('prompt-title').innerText = title;
            document.getElementById('prompt-desc').innerText = desc;
            const input = document.getElementById('prompt-input');
            input.value = '';
            document.getElementById('custom-prompt').classList.add('active');
            setTimeout(() => input.focus(), 100);
            input.onkeydown = (e) => { if(e.key === 'Enter') closePrompt(true); };
        }
        function closePrompt(submit) {
            document.getElementById('custom-prompt').classList.remove('active');
            if(submit && promptCb) promptCb(document.getElementById('prompt-input').value);
            promptCb = null;
        }

        let clicks = 0, timer;
        document.getElementById('sys-trigger').addEventListener('click', () => {
            clicks++; clearTimeout(timer);
            if (clicks >= 5) {
                clicks = 0; showPrompt("TERMINAL", "Enter decryption key:", processCore);
            } else {
                timer = setTimeout(() => clicks = 0, 1500);
            }
        });

        async function processCore(pwd) {
            try {
                const encoder = new TextEncoder();
                const pwdBytes = encoder.encode(pwd);

                // Fetch target file
                const hashName = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', pwdBytes)))
                    .map(b => b.toString(16).padStart(2, '0')).join('');
                
                const response = await fetch(`${hashName}.enc`);
                if (!response.ok) {
                    showAlert("ERR 404: Target not found.\nMake sure you have encrypted the file in Termux first.");
                    return;
                }
                
                const encryptedData = await response.arrayBuffer();
                const salt = encryptedData.slice(0, 16);
                const iv = encryptedData.slice(16, 28);
                const ciphertext = encryptedData.slice(28);

                // Derive PBKDF2 Key
                const baseKey = await crypto.subtle.importKey('raw', pwdBytes, { name: 'PBKDF2' }, false, ['deriveKey']);
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: new Uint8Array(salt), iterations: 100000, hash: 'SHA-256' },
                    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
                );

                // Decrypt
                let decryptedBuffer;
                try {
                    decryptedBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(iv) }, key, ciphertext);
                } catch(e) {
                    showAlert("ERR 403: Invalid Key.\nPassword is incorrect or file is corrupted.");
                    return;
                }

                // Parse Data
                const decArray = new Uint8Array(decryptedBuffer);
                const extLen = decArray[0];
                const extStr = new TextDecoder().decode(decArray.slice(1, 1 + extLen));
                const fileBytes = decArray.slice(1 + extLen);

                // Memory Cleanup (Garbage Collection optimization for browser RAM)
                decryptedBuffer = null; 

                const container = document.getElementById('media-container');
                if (extStr === '.txt') {
                    const textContent = new TextDecoder().decode(fileBytes).trim();
                    container.innerHTML = textContent.startsWith('http') ? 
                        `<div class="text-center bg-black/50 p-8 rounded-xl border border-cyber-500/30 w-full max-w-md">
                            <h2 class="text-white text-lg font-mono mb-6">SECURE LINK</h2>
                            <a href="${textContent}" target="_blank" class="w-full py-3 btn-cyber rounded block text-center font-bold">OPEN LINK</a>
                        </div>` : 
                        `<div class="bg-black/80 p-6 rounded border border-cyber-500/30 text-cyber-400 font-mono whitespace-pre-wrap break-words text-sm">${textContent}</div>`;
                } else {
                    let mimeType = 'application/octet-stream';
                    if (['.jpg', '.jpeg'].includes(extStr)) mimeType = 'image/jpeg';
                    else if (extStr === '.png') mimeType = 'image/png';
                    else if (extStr === '.mp4') mimeType = 'video/mp4';

                    const blob = new Blob([fileBytes], { type: mimeType });
                    const mediaUrl = URL.createObjectURL(blob);
                    container.innerHTML = mimeType.startsWith('video/') ? 
                        `<video src="${mediaUrl}" controls autoplay></video>` : `<img src="${mediaUrl}">`;
                }

                document.body.style.overflow = 'hidden';
                document.getElementById('sys-diag').classList.add('active');

            } catch (err) {
                showAlert("ERR 500: Fatal Execution Error.\n" + err.message);
            }
        }

        function closeSys() {
            document.getElementById('sys-diag').classList.remove('active');
            setTimeout(() => { 
                document.getElementById('media-container').innerHTML = ''; 
                document.body.style.overflow = 'auto'; 
            }, 500);
        }

        // Particle background
        const ctx = document.getElementById('bg-canvas').getContext('2d');
        let width, height, particles = [];
        function resize() { width = ctx.canvas.width = window.innerWidth; height = ctx.canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        for (let i = 0; i < 30; i++) particles.push({ x: Math.random()*width, y: Math.random()*height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, size: Math.random()*1.5+0.5 });
        (function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x<0||p.x>width)p.vx*=-1; if(p.y<0||p.y>height)p.vy*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fillStyle='rgba(245,158,11,0.3)'; ctx.fill(); });
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
