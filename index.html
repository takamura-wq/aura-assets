<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Assets | Creator Tools</title>
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            400: '#facc15', // Yellow 400
                            500: '#f59e0b', // Amber 500
                            600: '#d97706', // Amber 600
                            900: '#78350f', // Amber 900
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 4s linear infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020203;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Background Canvas */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none; 
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(145deg, rgba(15, 15, 18, 0.8), rgba(5, 5, 8, 0.95));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Cyber Button */
        .btn-cyber {
            background: linear-gradient(135deg, #d97706 0%, #facc15 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            color: #000;
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-cyber:hover {
            box-shadow: 0 6px 25px rgba(250, 204, 21, 0.6), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateY(-2px);
        }
        .btn-cyber:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Secret Vault Overlay */
        #secret-vault {
            position: fixed; inset: 0; background: rgba(2, 2, 3, 0.98);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9999; display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
            overflow-y: auto; padding: 20px;
        }
        #secret-vault.active { opacity: 1; pointer-events: auto; }
        #media-container { max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        #media-container video, #media-container img { width: 100%; border-radius: 12px; box-shadow: 0 0 40px rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }

        /* Custom Modals (Pop-up) */
        .cyber-modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px;
        }
        .cyber-modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .cyber-modal {
            transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%; max-width: 400px;
        }
        .cyber-modal-overlay.active .cyber-modal { transform: scale(1); }

        .cyber-input {
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(245, 158, 11, 0.3);
            color: #facc15; padding: 12px 15px; width: 100%; border-radius: 6px;
            font-family: 'JetBrains Mono', monospace; outline: none; transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .cyber-input:focus {
            border-color: #facc15; box-shadow: 0 0 15px rgba(245, 158, 11, 0.2), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    </style>
</head>

<body class="p-3 sm:p-4 md:p-8 flex justify-center items-start">
    
    <!-- Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="w-full max-w-4xl flex flex-col gap-6 md:gap-8 relative z-10 mx-auto pb-12">
        
        <!-- HEADER / NAVBAR (STEALTH TRIGGER) -->
        <nav class="glass-panel rounded-xl p-3 md:p-4 flex justify-between items-center z-20 sticky top-2 sm:top-4 opacity-0 animate-fade-up" style="animation-delay: 0ms;">
            
            <!-- TRIGGER RAHASIA: Tulisan ini terlihat sepele, gaya terminal, tidak mencolok -->
            <div id="logo" class="flex items-center gap-2 font-mono text-xs md:text-sm text-slate-500 cursor-default select-none py-2 pl-2 pr-4 rounded">
                <i class="fas fa-terminal text-cyber-500/50"></i>
                <span>sys.aura_assets<span class="cursor-blink text-cyber-400">_</span></span>
            </div>
            
            <!-- ALIBI TRAFFIC -->
            <div class="flex items-center gap-2 bg-black/50 border border-cyber-500/20 px-3 py-1.5 rounded-full">
                <i class="fas fa-fire text-orange-500 text-[10px] animate-pulse"></i>
                <span class="font-mono text-[10px] text-slate-300">10K+ DL/Today</span>
            </div>
        </nav>

        <!-- HERO SECTION -->
        <div class="flex flex-col items-center text-center mt-4 relative z-10 opacity-0 animate-fade-up" style="animation-delay: 150ms;">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white mb-3">Free Assets for <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyber-400 to-cyber-600">Creators</span></h1>
            <p class="text-xs md:text-sm text-slate-400 leading-relaxed max-w-lg mx-auto px-4 mb-2">
                Download free LUTs, transitions, and overlays. As a thank you to my subscribers, all assets here are 100% free to use in your projects.
            </p>
        </div>

        <!-- ASSETS GRID (KAMUFLASE) -->
        <main class="flex flex-col gap-4 mt-2 relative z-10 w-full">
            <div id="assets-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-5 w-full">
                <!-- Aset akan di-render via JavaScript -->
            </div>
        </main>
        
        <!-- FOOTER -->
        <footer class="py-6 mt-4 border-t border-cyber-500/20 text-center opacity-0 animate-fade-up" style="animation-delay: 600ms;">
             <p class="text-[10px] text-cyber-500/50 font-mono tracking-widest uppercase">sys.aura_assets // Online</p>
        </footer>
    </div>

    <!-- RUANG RAHASIA (PENONTON YOUTUBE) -->
    <div id="secret-vault">
        <div class="flex justify-between items-center mb-6 max-w-4xl mx-auto w-full">
            <div class="font-mono text-cyber-400 text-sm flex items-center gap-2">
                <i class="fas fa-lock-open"></i> VAULT DECRYPTED
            </div>
            <button onclick="closeVault()" class="w-10 h-10 flex items-center justify-center rounded bg-black/50 border border-cyber-500/30 hover:bg-cyber-500/20 hover:border-cyber-400 text-slate-400 hover:text-cyber-400 transition active:scale-90">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="media-container"></div>
    </div>

    <!-- CUSTOM ALERT MODAL (Untuk pengunjung / shortlink) -->
    <div id="custom-alert" class="cyber-modal-overlay">
        <div class="cyber-modal glass-panel p-6 rounded-xl border border-red-500/30 shadow-[0_0_40px_rgba(239,68,68,0.15)] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-red-600 via-orange-500 to-red-600"></div>
            <div class="flex items-center gap-3 mb-4 text-red-500">
                <i class="fas fa-exclamation-triangle text-xl animate-pulse"></i>
                <h3 class="font-mono font-bold tracking-widest text-sm md:text-base">SYSTEM ALERT</h3>
            </div>
            <p id="alert-msg" class="text-xs md:text-sm text-slate-300 font-mono leading-relaxed mb-6"></p>
            <button onclick="closeAlert()" class="w-full py-3 bg-red-500/10 hover:bg-red-500/20 border border-red-500/50 text-red-400 rounded font-mono font-bold transition-all active:scale-95 text-xs">ACKNOWLEDGE</button>
        </div>
    </div>

    <!-- CUSTOM PROMPT MODAL (Untuk input password rahasia) -->
    <div id="custom-prompt" class="cyber-modal-overlay">
        <div class="cyber-modal glass-panel p-6 rounded-xl border border-cyber-500/30 shadow-[0_0_40px_rgba(245,158,11,0.15)] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-cyber-400 via-cyber-600 to-cyber-400"></div>
            <div class="flex items-center gap-3 mb-4 text-cyber-400">
                <i class="fas fa-terminal text-xl"></i>
                <h3 class="font-mono font-bold tracking-widest text-sm md:text-base">TERMINAL ACCESS</h3>
            </div>
            <p class="text-xs text-slate-400 font-mono mb-3">Enter decryption key:</p>
            <input type="password" id="prompt-input" class="cyber-input mb-6 text-sm" autocomplete="off" placeholder="••••••••">
            <div class="flex gap-3">
                <button onclick="closePrompt(false)" class="flex-1 py-3 bg-black/50 hover:bg-white/5 border border-slate-700 text-slate-400 rounded font-mono font-bold transition-all active:scale-95 text-xs">CANCEL</button>
                <button onclick="closePrompt(true)" class="flex-1 py-3 btn-cyber rounded font-mono font-bold transition-all active:scale-95 text-xs">AUTHORIZE</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Daftar Aset Dummy untuk Kamuflase
        const ASSETS = [
            { nama: "Cinematic LUT Pack", format: ".cube", icon: "fas fa-film", deskripsi: "15 color grading presets for Premiere Pro & DaVinci Resolve.", size: "24 MB" },
            { nama: "Glitch Transitions", format: ".prproj", icon: "fas fa-bolt", deskripsi: "Drag-and-drop seamless glitch transitions for your next vlog.", size: "112 MB" },
            { nama: "Lo-Fi Backgrounds", format: ".mp3", icon: "fas fa-music", deskripsi: "No-copyright background music tracks for safe monetization.", size: "45 MB" },
            { nama: "Cyber UI Elements", format: ".psd", icon: "fas fa-layer-group", deskripsi: "Futuristic HUD and UI elements for gaming videos.", size: "89 MB" },
            { nama: "Film Grain Overlay", format: ".mp4", icon: "fas fa-video", deskripsi: "Real 35mm film grain scans with dirt and scratches. (4K)", size: "450 MB" },
            { nama: "Modern Typography", format: ".otf", icon: "fas fa-font", deskripsi: "A pack of 5 minimalist fonts perfect for thumbnails.", size: "2 MB" },
            { nama: "8-Bit SFX Bundle", format: ".wav", icon: "fas fa-volume-up", deskripsi: "Retro sound effects pack for gaming intros and memes.", size: "15 MB" },
            { nama: "Social Templates", format: ".aep", icon: "fas fa-photo-video", deskripsi: "After Effects templates for IG Reels and TikToks.", size: "210 MB" }
        ];

        function renderAssets() {
            const container = document.getElementById('assets-container');
            let html = '';
            
            ASSETS.forEach((item, index) => {
                const delay = 300 + (index * 50); 
                html += `
                    <div class="opacity-0 translate-y-10" style="animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${delay}ms forwards;">
                        <div class="cyber-card relative group rounded-xl p-[1px] h-full flex flex-col transform-gpu transition-transform duration-200" onpointerdown="this.style.transform='scale(0.98)'" onpointerup="this.style.transform='scale(1)'">
                            
                            <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none opacity-40 group-hover:opacity-100 transition-opacity duration-300">
                                <div class="absolute w-[200%] h-[200%] top-[-50%] left-[-50%] bg-[conic-gradient(from_0deg,transparent_0%,transparent_70%,#facc15_100%)] animate-spin-slow"></div>
                            </div>
                            
                            <div class="card-inner relative z-10 bg-[#07070a] rounded-[11px] p-4 md:p-5 flex flex-col h-full group-hover:bg-[#0a0a0f] transition-colors border border-white/5">
                                <div class="flex items-start gap-4 mb-3">
                                    <div class="w-12 h-12 shrink-0 rounded bg-black border border-cyber-500/20 text-cyber-500/70 flex justify-center items-center text-xl transition-all duration-300 group-hover:bg-cyber-400 group-hover:text-black group-hover:shadow-[0_0_15px_#facc15]">
                                        <i class="${item.icon}"></i>
                                    </div>
                                    <div class="flex-1 min-w-0 pt-1">
                                        <h3 class="text-white font-bold text-sm tracking-wide truncate group-hover:text-cyber-400">${item.nama}</h3>
                                        <span class="inline-block mt-1 text-[9px] uppercase font-mono bg-black border border-cyber-500/30 text-cyber-400 px-1.5 py-[2px] rounded">${item.format} • ${item.size}</span>
                                    </div>
                                </div>
                                <p class="text-slate-400 text-[10px] md:text-xs leading-relaxed font-mono flex-1 mb-5 group-hover:text-slate-300">${item.deskripsi}</p>
                                
                                <div class="mt-auto">
                                    <button onclick="fakeError()" class="w-full py-2.5 btn-cyber font-bold rounded text-[11px] transition-all flex items-center justify-center gap-2 group/btn">
                                        DOWNLOAD <i class="fas fa-download opacity-80 group-hover/btn:translate-y-1 transition-transform"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function initParticles() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
                    this.size = Math.random() * 1.5 + 0.5;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(245, 158, 11, 0.3)'; ctx.fill();
                }
            }

            const count = width > 768 ? 40 : 20;
            for (let i = 0; i < count; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // --- LOGIKA CUSTOM MODALS ---
        function showCustomAlert(message) {
            document.getElementById('alert-msg').innerText = message;
            document.getElementById('custom-alert').classList.add('active');
        }

        function closeAlert() {
            document.getElementById('custom-alert').classList.remove('active');
        }

        let promptCallback = null;
        function showCustomPrompt(callback) {
            promptCallback = callback;
            const promptModal = document.getElementById('custom-prompt');
            const inputField = document.getElementById('prompt-input');
            inputField.value = '';
            promptModal.classList.add('active');
            // Fokus otomatis ke input text
            setTimeout(() => inputField.focus(), 100);
            
            // Dukungan tekan "Enter" di keyboard HP/Laptop
            inputField.onkeydown = function(e) {
                if (e.key === 'Enter') closePrompt(true);
            };
        }

        function closePrompt(isSubmit) {
            const promptModal = document.getElementById('custom-prompt');
            const inputField = document.getElementById('prompt-input');
            promptModal.classList.remove('active');
            
            if (isSubmit && inputField.value && promptCallback) {
                promptCallback(inputField.value);
            }
            promptCallback = null;
        }

        // Fungsi Error Palsu untuk pihak shortlink
        function fakeError() {
            showCustomAlert("Bandwidth limit exceeded for today due to high YouTube traffic.\nPlease try downloading again in 24 hours.");
        }

        // ==========================================
        // LOGIKA RAHASIA (DEKRIPSI & TRIGGER)
        // ==========================================
        
        // 1. Ambil parameter kunci dari URL (Contoh: ?key=tutorial-bali)
        const urlParams = new URLSearchParams(window.location.search);
        const hiddenKey = urlParams.get('key'); 

        let clickCount = 0;
        let clickTimer;

        // 2. Trigger Rahasia (Klik "sys.aura_assets" 5x)
        document.getElementById('logo').addEventListener('click', (e) => {
            clickCount++;
            clearTimeout(clickTimer);
            
            if (clickCount >= 5) {
                clickCount = 0;
                if (hiddenKey) {
                    processVaultAccess(hiddenKey);
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else {
                    // Panggil pop-up buatan kita, bukan prompt bawaan
                    showCustomPrompt((pwd) => {
                        processVaultAccess(pwd);
                    });
                }
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
            }
        });

        // 3. Web Crypto API Decryption
        async function processVaultAccess(password) {
            try {
                const encoder = new TextEncoder();
                const pwdBytes = encoder.encode(password);

                const hashBuffer = await crypto.subtle.digest('SHA-256', pwdBytes);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const fileNameHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                const response = await fetch(`${fileNameHash}.enc`);
                if (!response.ok) throw new Error("File not found.");
                const encryptedData = await response.arrayBuffer();

                const key = await crypto.subtle.importKey(
                    'raw', hashBuffer, { name: 'AES-GCM' }, false, ['decrypt']
                );

                const iv = encryptedData.slice(0, 12);
                const data = encryptedData.slice(12);

                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: new Uint8Array(iv) }, key, data
                );
                
                const decArray = new Uint8Array(decryptedBuffer);
                const extLen = decArray[0];
                const extStr = new TextDecoder().decode(decArray.slice(1, 1 + extLen));
                const fileBytes = decArray.slice(1 + extLen);

                let mimeType = 'application/octet-stream';
                if (['.jpg', '.jpeg'].includes(extStr)) mimeType = 'image/jpeg';
                else if (extStr === '.png') mimeType = 'image/png';
                else if (extStr === '.mp4') mimeType = 'video/mp4';

                const blob = new Blob([fileBytes], { type: mimeType });
                const mediaUrl = URL.createObjectURL(blob);

                const container = document.getElementById('media-container');
                if (mimeType.startsWith('video/')) {
                    container.innerHTML = `<video src="${mediaUrl}" controls autoplay controlsList="nodownload"></video>`;
                } else {
                    container.innerHTML = `<img src="${mediaUrl}" alt="Decrypted File">`;
                }

                document.body.style.overflow = 'hidden'; // Kunci scroll belakang
                document.getElementById('secret-vault').classList.add('active');

            } catch (error) {
                console.error(error);
                // Ganti alert bawaan dengan custom alert merah
                showCustomAlert("ERR 403: Invalid Key or Corrupted File.");
            }
        }

        function closeVault() {
            document.getElementById('secret-vault').classList.remove('active');
            // Hapus isi video/gambar agar suara mati dan memori bersih
            setTimeout(() => {
                document.getElementById('media-container').innerHTML = ''; 
                document.body.style.overflow = 'auto';
            }, 500);
        }

        // Inisialisasi
        document.addEventListener('DOMContentLoaded', () => {
            renderAssets();
            initParticles();
        });
    </script>
</body>
</html>
