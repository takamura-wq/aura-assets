<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Studio | License Key</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { cyber: { 400: '#facc15', 500: '#f59e0b', dark: '#030305' } },
                    animation: { 
                        'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scan': 'scan 2.5s ease-in-out infinite alternate',
                        'pulse-glow': 'pulseGlow 2s infinite'
                    },
                    keyframes: {
                        fadeUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        scan: { '0%': { top: '0%' }, '100%': { top: '100%' } },
                        pulseGlow: { '0%, 100%': { opacity: 1 }, '50%': { opacity: 0.5 } }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030305; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0; padding: 20px; }
        
        .bg-grid { position: absolute; inset: 0; background-size: 50px 50px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); mask-image: radial-gradient(circle at center, black 30%, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%); z-index: -1; }

        .glass-card { background: rgba(10, 10, 14, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05); position: relative; }

        /* Token Display Area */
        .token-display { background: rgba(0, 0, 0, 0.6); position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .token-display.valid { border-color: rgba(245, 158, 11, 0.3); color: #facc15; box-shadow: inset 0 0 30px rgba(245, 158, 11, 0.05); }
        .token-display.invalid { border-color: rgba(239, 68, 68, 0.3); color: #ef4444; box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.05); }
        
        /* Laser Scanline */
        .laser { position: absolute; left: 0; right: 0; height: 2px; background: #facc15; box-shadow: 0 0 10px #facc15, 0 0 20px #facc15; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.3s, background 0.3s, box-shadow 0.3s; }
        .token-display.valid .laser { opacity: 0.7; }
        .token-display.invalid .laser { opacity: 0.7; background: #ef4444; box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444; }

        /* Buttons */
        .btn-primary { background: linear-gradient(135deg, #f59e0b, #facc15); color: #000; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2); transition: all 0.3s; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4); filter: brightness(1.1); }
        .btn-primary:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
        
        .btn-secondary { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; transition: all 0.3s; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }

        /* Toast Animation */
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #facc15; color: #000; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(245,158,11,0.3); transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; }
        .toast.show { bottom: 40px; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <main class="w-full max-w-[400px] glass-card rounded-2xl p-8 z-10 animate-fade-up">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div id="icon-box" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/5 border border-white/10 mb-5 text-white shadow-sm transition-all duration-500">
                <i class="fas fa-fingerprint text-2xl"></i>
            </div>
            <h1 class="text-sm font-extrabold text-white tracking-[0.2em] uppercase">License Key</h1>
            <p id="status-text" class="text-[10px] text-slate-400 mt-2 font-mono">GENERATING SECURE TOKEN...</p>
        </div>
        
        <!-- Token Display -->
        <div id="tokenContainer" class="token-display rounded-xl text-center text-[1rem] leading-tight md:text-xl font-black tracking-wider p-4 mb-8 min-h-[80px] flex items-center justify-center break-all">
            <div class="laser animate-scan"></div>
            <span id="tokenText" class="relative z-20 font-mono text-slate-500">INITIATING...</span>
        </div>
        
        <!-- Actions -->
        <div class="flex flex-col gap-3">
            <button id="copyBtn" onclick="copyToken()" disabled class="btn-primary w-full py-3.5 rounded-xl text-xs font-extrabold tracking-widest flex items-center justify-center gap-2">
                <i class="fas fa-copy"></i> COPY KEY
            </button>
            
            <a href="https://aura-assets-nine.vercel.app/" class="btn-secondary w-full py-3.5 rounded-xl text-xs font-bold text-slate-300 flex items-center justify-center gap-2">
                <i class="fas fa-home"></i> RETURN TO STUDIO
            </a>
        </div>
    </main>

    <div id="toastBox" class="toast">
        <i class="fas fa-check-circle"></i> License Key Copied!
    </div>

    <script>
        // Custom logic untuk menangkap RAW parameter dari URL agar simbol `&` tidak terpotong
        let token = null;
        const searchRaw = window.location.search;
        const codeMatch = searchRaw.match(/[?&]code=([^]*)/);
        
        if (codeMatch && codeMatch[1]) {
            token = codeMatch[1];
            try {
                // Lakukan decoding seandainya browser mengirim dalam bentuk percent-encoded
                token = decodeURIComponent(token);
            } catch(e) {
                // Biarkan teks tetap raw jika tidak bisa di-decode
                console.warn("Could not decode URI component", e);
            }
        }
        
        const tokenDisplay = document.getElementById('tokenText');
        const tokenContainer = document.getElementById('tokenContainer');
        const copyBtn = document.getElementById('copyBtn');
        const statusText = document.getElementById('status-text');
        const iconBox = document.getElementById('icon-box');

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$X&?';
        
        function runDecryption(targetText, isError = false) {
            let iterations = 0;
            const maxIterations = targetText.length;
            const interval = setInterval(() => {
                tokenDisplay.innerText = targetText.split('').map((char, index) => {
                    if (index < iterations) return char;
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                
                // Kurangi kecepatan animasi sedikit untuk teks yang sangat panjang 
                iterations += 1/2; 
                
                if (iterations >= maxIterations) {
                    clearInterval(interval);
                    tokenDisplay.innerText = targetText;
                    
                    if (isError) {
                        tokenContainer.classList.add('invalid');
                        statusText.innerText = 'INVALID OR MISSING PARAMETER';
                        statusText.classList.add('text-red-400');
                        iconBox.classList.replace('bg-white/5', 'bg-red-500/10');
                        iconBox.classList.replace('border-white/10', 'border-red-500/30');
                        iconBox.classList.replace('text-white', 'text-red-500');
                        iconBox.innerHTML = '<i class="fas fa-exclamation-triangle text-2xl"></i>';
                        copyBtn.innerHTML = '<i class="fas fa-ban"></i> ACCESS DENIED';
                    } else {
                        tokenContainer.classList.add('valid');
                        statusText.innerText = 'ACCESS GRANTED';
                        statusText.classList.add('text-cyber-400');
                        iconBox.classList.replace('bg-white/5', 'bg-cyber-500/10');
                        iconBox.classList.replace('border-white/10', 'border-cyber-500/30');
                        iconBox.classList.replace('text-white', 'text-cyber-400');
                        iconBox.innerHTML = '<i class="fas fa-check-circle text-2xl"></i>';
                        copyBtn.disabled = false; 
                    }
                }
            }, 20);
        }

        window.onload = () => {
            setTimeout(() => {
                if (token && token.trim() !== '') {
                    runDecryption(token);
                } else {
                    runDecryption("ERR_NO_TOKEN", true);
                }
            }, 600); 
        };

        function copyToken() {
            if (!token || copyBtn.disabled) return;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(token).then(showToast).catch(fallbackCopy);
            } else {
                fallbackCopy();
            }
        }
        
        function fallbackCopy() {
            const textArea = document.createElement("textarea");
            textArea.value = token;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById('toastBox');
            toast.classList.add('show');
            
            const originalBtn = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> COPIED!';
            copyBtn.classList.add('bg-white', 'text-black');
            copyBtn.style.background = '#ffffff'; 
            
            setTimeout(() => {
                toast.classList.remove('show');
                copyBtn.innerHTML = originalBtn;
                copyBtn.classList.remove('bg-white', 'text-black');
                copyBtn.style.background = ''; 
            }, 2500);
        }
    </script>
</body>
</html>
